<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - LinkSpy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #07080f;
      --surface:  #0d0f1d;
      --border:   rgba(148,163,184,.12);
      --text:     #dde2ef;
      --muted:    #64748b;
      --accent:   #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.3);
      --green:    #22c55e;
      --green-glow: rgba(34, 197, 94, 0.3);
      --purple:   #a855f7;
      --purple-glow: rgba(168, 85, 247, 0.3);
      --red:      #ef4444;
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Animated Background */
    .bg-gradient {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(ellipse at 20% 20%, var(--accent-glow) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, var(--purple-glow) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, var(--green-glow) 0%, transparent 50%);
      animation: gradientShift 15s ease-in-out infinite;
      z-index: -1;
    }

    @keyframes gradientShift {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.1); }
    }

    .auth-container {
      width: 100%;
      max-width: 420px;
    }

    .auth-card {
      background: rgba(13, 15, 29, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 40px;
      animation: fadeInUp 0.8s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(90deg, #00ff88, #00ccff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.1em;
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 8px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.3s;
    }

    input:focus {
      border-color: var(--accent);
      background: rgba(255,255,255,0.08);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .btn {
      width: 100%;
      padding: 14px 20px;
      border-radius: 12px;
      border: none;
      font-family: 'Syne', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 0.05em;
      background: linear-gradient(135deg, var(--accent), var(--purple));
      color: #0b1219;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px var(--accent-glow);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .error {
      display: none;
      margin-bottom: 20px;
      padding: 14px 16px;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 12px;
      font-size: 0.85rem;
      color: var(--red);
      text-align: center;
    }

    .error.show {
      display: block;
      animation: shake 0.3s;
    }

    .notice {
      display: none;
      margin-bottom: 20px;
      padding: 14px 16px;
      border: 1px solid rgba(0,255,136,.28);
      border-radius: 12px;
      background: rgba(0,255,136,.08);
      color: var(--green);
      font-size: .85rem;
      line-height: 1.6;
      text-align: center;
    }
    .notice.show { display: block; animation: fadeInUp .35s ease-out; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .footer-link {
      text-align: center;
      margin-top: 24px;
      font-size: 0.85rem;
    }

    .footer-link a {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.3s;
    }

    .footer-link a:hover {
      color: var(--accent);
    }

    .footer-link span {
      color: var(--accent);
    }

    .lang-selector {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.3s;
      font-family: 'JetBrains Mono', monospace;
    }

    .lang-selector:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: 32px 24px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>
  <button id="langBtn" class="lang-selector">🌐 EN</button>

  <div class="auth-container">
    <div class="auth-card">
      <div class="logo">LINKSPY</div>
      <p class="subtitle" data-i18n="subtitle">Sign in to your account</p>

      <div id="notice" class="notice" role="status" aria-live="polite"></div>
      <div id="error" class="error"></div>

      <form id="loginForm" action="/api/login" method="post">
        <div class="field">
          <label for="username" data-i18n="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required autofocus>
        </div>

        <div class="field">
          <label for="password" data-i18n="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn" id="submitBtn" data-i18n="login">Sign In</button>
      </form>

      <div class="footer-link">
        <a href="/register">
          <span data-i18n="noAccount">Don't have an account?</span> <span data-i18n="register">Sign up</span>
        </a>
      </div>
    </div>
  </div>

  <script>
    const translations = {
      nl: {
        subtitle: 'Log in op je account',
        username: 'Gebruikersnaam',
        password: 'Wachtwoord',
        login: 'Inloggen',
        noAccount: 'Nog geen account?',
        register: 'Registreren',
        loginFailed: 'Ongeldige gebruikersnaam of wachtwoord.',
        networkError: 'Netwerkfout opgetreden.',
        logoutSuccess: 'Je bent veilig uitgelogd. Tot de volgende keer!',
        loading: 'Bezig...'
      },
      en: {
        subtitle: 'Sign in to your account',
        username: 'Username',
        password: 'Password',
        login: 'Sign In',
        noAccount: "Don't have an account?",
        register: 'Sign up',
        loginFailed: 'Invalid username or password.',
        networkError: 'Network error occurred.',
        logoutSuccess: 'You have been securely logged out. See you next time!',
        loading: 'Loading...'
      }
    };

    let currentLang = localStorage.getItem('lang') || 'en';

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('lang', lang);
      document.getElementById('langBtn').textContent = lang === 'nl' ? '🌐 NL' : '🌐 EN';

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang][key]) {
          el.textContent = translations[lang][key];
        }
      });
    }

    function t(key) {
      return translations[currentLang][key] || key;
    }

    async function handleLogin(event) {
      event.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');
      const submitBtn = document.getElementById('submitBtn');

      errorEl.classList.remove('show');
      submitBtn.disabled = true;
      submitBtn.textContent = t('loading');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          window.location.href = '/admin';
        } else {
          errorEl.textContent = data.error || t('loginFailed');
          errorEl.classList.add('show');
        }
      } catch (err) {
        errorEl.textContent = t('networkError');
        errorEl.classList.add('show');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = t('login');
      }
    }

    document.getElementById('loginForm').addEventListener('submit', handleLogin);
    document.getElementById('langBtn').addEventListener('click', () => {
      setLanguage(currentLang === 'nl' ? 'en' : 'nl');
    });

    setLanguage(currentLang);

    if (new URLSearchParams(window.location.search).get('loggedOut') === '1') {
      const notice = document.getElementById('notice');
      notice.textContent = t('logoutSuccess');
      notice.classList.add('show');
      window.history.replaceState({}, document.title, window.location.pathname);
    }
  </script>
</body>
</html>
