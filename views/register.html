<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registratie</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@600;800&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #07080f;
      --surface:  #0d0f1d;
      --border:   rgba(148,163,184,.12);
      --text:     #dde2ef;
      --muted:    #64748b;
      --accent:   #38bdf8;
      --green:    #22c55e;
      --red:      #ef4444;
      --radius:   18px;
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
    }
    .card {
      background: var(--surface);
      padding: 40px;
      border-radius: var(--radius);
      width: 100%;
      max-width: 400px;
      border: 1px solid var(--border);
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      background: linear-gradient(90deg, #00ff88, #00ccff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 30px;
      text-align: center;
    }
    .field { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 0.9rem; }
    input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 14px;
      font-family: 'JetBrains Mono', monospace;
      transition: border-color 0.2s;
    }
    input:focus { outline: none; border-color: var(--accent); }
    button {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #0b1219;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    .error { color: var(--red); margin-top: 15px; text-align: center; font-size: 0.9rem; }
    .success { color: var(--green); margin-top: 15px; text-align: center; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Registratie</h1>
    <div class="field">
      <label>Gebruikersnaam</label>
      <input type="text" id="username">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="email">
    </div>
    <div class="field">
      <label>Wachtwoord</label>
      <input type="password" id="password">
    </div>
    <div class="field">
      <label>Invite Token</label>
      <input type="text" id="inviteToken">
    </div>
    <button onclick="register()">Registreren</button>
    <div id="message"></div>
  </div>
  <script>
    async function register() {
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const inviteToken = document.getElementById('inviteToken').value;
      const msg = document.getElementById('message');

      if (!username || !email || !password || !inviteToken) {
        msg.className = 'error';
        msg.textContent = 'Vul alle velden in.';
        return;
      }

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password, inviteToken })
        });
        const data = await res.json();

        if (data.success) {
          msg.className = 'success';
          msg.textContent = data.message;
          setTimeout(() => window.location.href = '/login', 2000);
        } else {
          msg.className = 'error';
          msg.textContent = data.error;
        }
      } catch (err) {
        msg.className = 'error';
        msg.textContent = 'Registratie mislukt.';
      }
    }

    // Get token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    if (token) {
      document.getElementById('inviteToken').value = token;
    }
  </script>
</body>
</html>
