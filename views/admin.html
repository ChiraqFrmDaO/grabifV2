<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gebruikersbeheer - Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@600;800&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #07080f;
      --surface:  #0d0f1d;
      --border:   rgba(148,163,184,.12);
      --text:     #dde2ef;
      --muted:    #64748b;
      --accent:   #38bdf8;
      --green:    #22c55e;
      --red:      #ef4444;
      --radius:   18px;
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 20px 60px;
    }

    .container { max-width: 1180px; margin: 0 auto; }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 30px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      background: linear-gradient(90deg, #00ff88, #00ccff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header span {
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: .05em;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .user-badge {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 0.85rem;
      color: var(--text);
      white-space: nowrap;
    }
    .user-badge .role {
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.7rem;
      margin-left: 6px;
      padding: 2px 6px;
      background: var(--accent);
      color: #0b1219;
      border-radius: 4px;
    }
    .logout-btn {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: var(--red);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .logout-btn:hover {
      background: rgba(239, 68, 68, 0.25);
    }
    .lang-selector {
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.2s;
      white-space: nowrap;
    }
    .lang-selector:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 10px 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      border-radius: 8px;
    }
    .tab-btn:hover {
      color: var(--text);
      background: rgba(255,255,255,.05);
    }
    .tab-btn.active {
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
    }
    .section-title {
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 18px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 11px 20px;
      border-radius: 11px;
      border: none;
      font-family: 'Syne', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, transform .12s;
      white-space: nowrap;
    }
    .btn:hover:not(:disabled) { opacity: .85; transform: translateY(-1px); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary   { background: var(--accent); color: #0b1219; }
    .btn-secondary { background: rgba(255,255,255,.08); color: var(--text); }
    .btn-danger    { background: var(--red);   color: #fff; }
    .btn-sm { padding: 7px 13px; font-size: 0.8rem; }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 22px;
      font-size: 0.88rem;
      box-shadow: 0 12px 40px rgba(0,0,0,.6);
      transition: transform .3s cubic-bezier(.22,1,.36,1), opacity .3s;
      opacity: 0;
      z-index: 9000;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.success { border-color: var(--green); color: var(--green); }
    .toast.error   { border-color: var(--red);   color: var(--red);   }

    .invites-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }
    .invite-card {
      background: rgba(255,255,255,.03);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
    }
    .invite-card .meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 4px;
      word-break: break-all;
    }
    .invite-card .actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .table-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>
<div class="container">

  <header>
    <div>
      <h1 data-i18n="adminPanel">Admin Panel</h1>
      <span data-i18n="subtitle">User Management & Invites</span>
    </div>
    <div class="user-info">
      <div class="user-badge">
        <span id="username">Loading...</span>
        <span class="role" id="userRole">-</span>
      </div>
      <button id="langBtn" class="lang-selector">🌐 NL</button>
      <button id="backBtn" class="btn btn-secondary btn-sm" data-i18n="backBtn">← Dashboard</button>
      <button id="logoutBtn" class="logout-btn" data-i18n="logoutBtn">↪ Uitloggen</button>
    </div>
  </header>

  <div class="section">
    <div class="tabs">
      <button class="tab-btn active" data-tab="users" data-i18n="usersTab">Users</button>
      <button class="tab-btn" data-tab="invites" data-i18n="invitesTab">Invites</button>
      <button class="tab-btn" data-tab="api" data-i18n="apiTab">API Token</button>
    </div>

    <div id="usersTab" class="tab-content active">
      <div class="table-header">
        <p class="section-title" style="margin:0;" data-i18n="usersTitle">Users</p>
      </div>
      <div id="usersList" class="invites-grid">
        <div class="skeleton" style="height:60px;"></div>
      </div>
    </div>

    <div id="invitesTab" class="tab-content">
      <div class="table-header">
        <p class="section-title" style="margin:0;" data-i18n="invitesTitle">Invites</p>
        <button id="generateInviteBtn" class="btn btn-primary" data-i18n="newInvite">+ Nieuwe Invite</button>
      </div>
      <div id="invitesList" class="invites-grid">
        <div class="skeleton" style="height:60px;"></div>
      </div>
    </div>

    <div id="apiTab" class="tab-content">
      <div class="table-header">
        <p class="section-title" style="margin:0;" data-i18n="apiTitle">API Token</p>
        <button id="generateApiTokenBtn" class="btn btn-primary" data-i18n="newApiToken">+ Generate New Token</button>
      </div>
      <div id="apiTokenSection" style="display:none;">
        <div class="field">
          <label data-i18n="currentApiToken">Current API Token:</label>
          <input type="text" id="apiTokenDisplay" readonly style="font-family:monospace;">
        </div>
        <div style="margin-top:12px;">
          <button id="copyApiTokenBtn" class="btn btn-secondary btn-sm" data-i18n="copyToken">📋 Copy Token</button>
        </div>
      </div>
      <div id="noApiToken" style="color:var(--muted);padding:12px;font-size:.85rem;" data-i18n="noApiToken">
        No API token generated yet.
      </div>
    </div>
  </div>

</div>

<div id="toast" class="toast"></div>

<script>
  'use strict';

  // ── Translations ─────────────────────────────────────────────────────────
  const translations = {
    nl: {
      adminPanel: 'Admin Panel',
      subtitle: 'User Management & Invites',
      backBtn: '← Dashboard',
      logoutBtn: '↪ Uitloggen',
      usersTab: 'Users',
      invitesTab: 'Invites',
      apiTab: 'API Token',
      usersTitle: 'Users',
      invitesTitle: 'Invites',
      apiTitle: 'API Token',
      newInvite: '+ Nieuwe Invite',
      newApiToken: '+ Generate New Token',
      user: 'User',
      email: 'Email',
      role: 'Role',
      makeAdmin: '↑ Make Admin',
      makeUser: '↓ Make User',
      token: 'Token',
      created: 'Aangemaakt',
      copyInvite: '📋 Kopieer',
      copyToken: '📋 Copy Token',
      currentApiToken: 'Current API Token:',
      inviteLink: 'Invite link gekopieerd!',
      inviteFailed: 'Invite genereren mislukt.',
      inviteNetworkError: 'Netwerkfout bij invite.',
      inviteSuccess: 'Invite link gekopieerd!',
      noUsers: 'Geen users gevonden.',
      noInvites: 'Geen actieve invites.',
      noApiToken: 'No API token generated yet.',
      apiTokenGenerated: 'API token generated!',
      apiTokenFailed: 'API token generation failed.',
      apiTokenCopied: 'API token copied!',
      roleChanged: 'User is nu',
      roleChangeFailed: 'Role wijzigen mislukt.',
      roleNetworkError: 'Netwerkfout bij role wijzigen.',
      grantApiAccess: '✓ Grant API Access',
      revokeApiAccess: '✗ Revoke API Access',
      apiAccessGranted: 'API access granted',
      apiAccessRevoked: 'API access revoked',
      apiAccessChangeFailed: 'API access change failed',
      apiAccessNetworkError: 'Network error on API access change',
      confirmLogout: 'Weet je zeker dat je wilt uitloggen?',
      logoutError: 'Fout bij uitloggen.'
    },
    en: {
      adminPanel: 'Admin Panel',
      subtitle: 'User Management & Invites',
      backBtn: '← Dashboard',
      logoutBtn: '↪ Logout',
      usersTab: 'Users',
      invitesTab: 'Invites',
      apiTab: 'API Token',
      usersTitle: 'Users',
      invitesTitle: 'Invites',
      apiTitle: 'API Token',
      newInvite: '+ New Invite',
      newApiToken: '+ Generate New Token',
      user: 'User',
      email: 'Email',
      role: 'Role',
      makeAdmin: '↑ Make Admin',
      makeUser: '↓ Make User',
      token: 'Token',
      created: 'Created',
      copyInvite: '📋 Copy',
      copyToken: '📋 Copy Token',
      currentApiToken: 'Current API Token:',
      inviteLink: 'Invite link copied!',
      inviteFailed: 'Invite generation failed.',
      inviteNetworkError: 'Network error on invite.',
      inviteSuccess: 'Invite link copied!',
      noUsers: 'No users found.',
      noInvites: 'No active invites.',
      noApiToken: 'No API token generated yet.',
      apiTokenGenerated: 'API token generated!',
      apiTokenFailed: 'API token generation failed.',
      apiTokenCopied: 'API token copied!',
      roleChanged: 'User is now',
      roleChangeFailed: 'Role change failed.',
      roleNetworkError: 'Network error on role change.',
      grantApiAccess: '✓ Grant API Access',
      revokeApiAccess: '✗ Revoke API Access',
      apiAccessGranted: 'API access granted',
      apiAccessRevoked: 'API access revoked',
      apiAccessChangeFailed: 'API access change failed',
      apiAccessNetworkError: 'Network error on API access change',
      confirmLogout: 'Are you sure you want to logout?',
      logoutError: 'Logout error.'
    }
  };

  let currentLang = localStorage.getItem('lang') || 'nl';

  function setLanguage(lang) {
    currentLang = lang;
    localStorage.setItem('lang', lang);
    document.getElementById('langBtn').textContent = lang === 'nl' ? '🌐 NL' : '🌐 EN';

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (translations[lang][key]) {
        el.textContent = translations[lang][key];
      }
    });

    // Re-render dynamic content
    loadUsers();
    loadInvites();
  }

  function t(key) {
    return translations[currentLang][key] || key;
  }

  function showToast(msg, type = 'success') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className   = `toast ${type} show`;
    setTimeout(() => { el.className = 'toast'; }, 3000);
  }

  document.getElementById('backBtn').addEventListener('click', () => {
    window.location.href = '/dashboard';
  });

  document.getElementById('logoutBtn').addEventListener('click', logout);
  document.getElementById('langBtn').addEventListener('click', () => {
    setLanguage(currentLang === 'nl' ? 'en' : 'nl');
  });

  async function logout() {
    if (!confirm(t('confirmLogout'))) return;
    try {
      const res = await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' });
      if (res.ok) {
        window.location.href = '/login';
      }
    } catch (err) {
      alert(t('logoutError'));
    }
  }

  async function loadUserInfo() {
    try {
      const res = await fetch('/api/user', { credentials: 'same-origin' });
      const data = await res.json();
      console.log('User info response:', data);

      if (data.authenticated) {
        const usernameEl = document.getElementById('username');
        const userRoleEl = document.getElementById('userRole');

        if (usernameEl) usernameEl.textContent = data.user;
        if (userRoleEl) userRoleEl.textContent = data.role;
      }
    } catch (err) {
      console.error('Failed to load user info:', err);
    }
  }

  document.getElementById('generateInviteBtn').addEventListener('click', generateInvite);
  document.getElementById('generateApiTokenBtn').addEventListener('click', generateApiToken);
  document.getElementById('copyApiTokenBtn').addEventListener('click', copyApiToken);

  async function generateInvite() {
    try {
      const res = await fetch('/api/invites', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' }
      });
      const data = await res.json();
      
      if (data.success) {
        navigator.clipboard.writeText(data.inviteUrl);
        showToast(`Invite link gekopieerd!\n${data.inviteUrl}`, 'success');
        loadInvites();
      } else {
        showToast('Invite genereren mislukt.', 'error');
      }
    } catch (err) {
      showToast('Netwerkfout bij invite.', 'error');
    }
  }

  async function loadInvites() {
    const container = document.getElementById('invitesList');

    try {
      const res = await fetch('/api/invites', { credentials: 'same-origin' });
      const invites = await res.json();

      container.innerHTML = '';

      if (!invites.length) {
        const msg = document.createElement('p');
        msg.style.cssText = 'color:var(--muted);padding:12px;font-size:.85rem;';
        msg.textContent = t('noInvites');
        container.appendChild(msg);
        return;
      }

      invites.forEach(invite => {
        const card = document.createElement('div');
        card.className = 'invite-card';

        const token = document.createElement('div');
        token.className = 'meta';
        token.textContent = `${t('token')}: ${invite.invite_token}`;

        const date = document.createElement('div');
        date.className = 'meta';
        const locale = currentLang === 'nl' ? 'nl-NL' : 'en-US';
        date.textContent = `${t('created')}: ${new Date(invite.created_at).toLocaleString(locale)}`;

        const actions = document.createElement('div');
        actions.className = 'actions';

        const copyBtn = document.createElement('button');
        copyBtn.className = 'btn btn-secondary btn-sm';
        copyBtn.textContent = t('copyInvite');
        copyBtn.onclick = () => {
          const url = `${window.location.origin}/register?token=${invite.invite_token}`;
          navigator.clipboard.writeText(url);
          showToast(t('inviteLink'), 'success');
        };

        actions.appendChild(copyBtn);
        card.append(token, date, actions);
        container.appendChild(card);
      });
    } catch (err) {
      console.error('Invites laden mislukt:', err);
    }
  }

  async function loadUsers() {
    const container = document.getElementById('usersList');

    try {
      const res = await fetch('/api/users', { credentials: 'same-origin' });
      const users = await res.json();

      container.innerHTML = '';

      if (!users.length) {
        const msg = document.createElement('p');
        msg.style.cssText = 'color:var(--muted);padding:12px;font-size:.85rem;';
        msg.textContent = t('noUsers');
        container.appendChild(msg);
        return;
      }

      users.forEach(user => {
        const card = document.createElement('div');
        card.className = 'invite-card';

        const username = document.createElement('div');
        username.className = 'meta';
        username.textContent = `${t('user')}: ${user.username}`;

        const email = document.createElement('div');
        email.className = 'meta';
        email.textContent = `${t('email')}: ${user.email}`;

        const role = document.createElement('div');
        role.className = 'meta';
        role.textContent = `${t('role')}: ${user.role}`;

        const actions = document.createElement('div');
        actions.className = 'actions';

        const toggleRoleBtn = document.createElement('button');
        toggleRoleBtn.className = 'btn btn-secondary btn-sm';
        toggleRoleBtn.textContent = user.role === 'admin' ? t('makeUser') : t('makeAdmin');
        toggleRoleBtn.onclick = () => toggleUserRole(user.username, user.role);

        const toggleApiAccessBtn = document.createElement('button');
        toggleApiAccessBtn.className = 'btn btn-secondary btn-sm';
        toggleApiAccessBtn.textContent = user.api_access ? t('revokeApiAccess') : t('grantApiAccess');
        toggleApiAccessBtn.onclick = () => toggleApiAccess(user.username, user.api_access);

        actions.appendChild(toggleRoleBtn);
        actions.appendChild(toggleApiAccessBtn);
        card.append(username, email, role, actions);
        container.appendChild(card);
      });
    } catch (err) {
      console.error('Users laden mislukt:', err);
    }
  }

  async function toggleUserRole(username, currentRole) {
    const newRole = currentRole === 'admin' ? 'user' : 'admin';
    try {
      const res = await fetch('/api/users/role', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, role: newRole })
      });
      const data = await res.json();

      if (data.success) {
        showToast(`${t('roleChanged')} "${username}" ${newRole}!`, 'success');
        loadUsers();
      } else {
        showToast(t('roleChangeFailed'), 'error');
      }
    } catch (err) {
      showToast(t('roleNetworkError'), 'error');
    }
  }

  async function toggleApiAccess(username, currentAccess) {
    const newAccess = !currentAccess;
    try {
      const res = await fetch('/api/users/api-access', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, api_access: newAccess })
      });
      const data = await res.json();

      if (data.success) {
        showToast(`${username} ${newAccess ? t('apiAccessGranted') : t('apiAccessRevoked')}!`, 'success');
        loadUsers();
      } else {
        showToast(t('apiAccessChangeFailed'), 'error');
      }
    } catch (err) {
      showToast(t('apiAccessNetworkError'), 'error');
    }
  }

  async function generateApiToken() {
    try {
      const res = await fetch('/api/api-token', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' }
      });
      const data = await res.json();

      if (data.success) {
        document.getElementById('apiTokenDisplay').value = data.api_token;
        document.getElementById('apiTokenSection').style.display = '';
        document.getElementById('noApiToken').style.display = 'none';
        showToast(t('apiTokenGenerated'), 'success');
      } else {
        showToast(t('apiTokenFailed'), 'error');
      }
    } catch (err) {
      showToast(t('apiTokenFailed'), 'error');
    }
  }

  async function copyApiToken() {
    const token = document.getElementById('apiTokenDisplay').value;
    if (token) {
      navigator.clipboard.writeText(token);
      showToast(t('apiTokenCopied'), 'success');
    }
  }

  async function loadApiToken() {
    try {
      const res = await fetch('/api/user', { credentials: 'same-origin' });
      const data = await res.json();

      if (data.authenticated && data.api_token) {
        document.getElementById('apiTokenDisplay').value = data.api_token;
        document.getElementById('apiTokenSection').style.display = '';
        document.getElementById('noApiToken').style.display = 'none';
      } else {
        document.getElementById('noApiToken').style.display = '';
        document.getElementById('apiTokenSection').style.display = 'none';
      }
    } catch (err) {
      console.error('Failed to load API token status:', err);
    }
  }

  // Tab switching
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.getAttribute('data-tab');

      // Update buttons
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      // Update content
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      document.getElementById(`${tab}Tab`).classList.add('active');
    });
  });

  document.addEventListener('DOMContentLoaded', () => {
    setLanguage(currentLang);
    loadUserInfo();
    loadUsers();
    loadInvites();
    loadApiToken();
  });
</script>
</body>
</html>
