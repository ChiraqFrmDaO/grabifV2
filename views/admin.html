<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gebruikersbeheer - LinkSpy Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@600;800&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #07080f;
      --surface:  #0d0f1d;
      --border:   rgba(0,204,255,.16);
      --text:     #dde2ef;
      --muted:    #64748b;
      --accent:   #00ccff;
      --green:    #00ff88;
      --red:      #ef4444;
      --radius:   18px;
      --brand-gradient: linear-gradient(90deg, #00ff88, #00ccff);
      --accent-glow: rgba(0,204,255,.2);
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 20px 60px;
    }
    body::before {
      content: '';
      position: fixed;
      inset: -35%;
      z-index: 0;
      background:
        radial-gradient(ellipse at 25% 35%, rgba(0,255,136,.09) 0%, transparent 55%),
        radial-gradient(ellipse at 75% 65%, rgba(0,204,255,.08) 0%, transparent 55%);
      animation: ambientGlow 12s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes ambientGlow {
      from { opacity: .65; transform: scale(1); }
      to { opacity: 1; transform: scale(1.05); }
    }

    .container { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 28px;
      padding: 16px 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(7,8,15,.78);
      backdrop-filter: blur(20px);
      box-shadow: 0 12px 40px rgba(0,0,0,.2);
    }
    header h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      background: var(--brand-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header span {
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: .05em;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .user-badge {
      background: rgba(0,204,255,.1);
      border: 1px solid rgba(0,204,255,.3);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 0.85rem;
      color: var(--text);
      white-space: nowrap;
    }
    .user-badge .role {
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.7rem;
      margin-left: 6px;
      padding: 2px 6px;
      background: var(--brand-gradient);
      color: #0b1219;
      border-radius: 4px;
    }
    .logout-btn {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: var(--red);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .logout-btn:hover {
      background: rgba(239, 68, 68, 0.25);
    }
    .lang-selector {
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.2s;
      white-space: nowrap;
    }
    .lang-selector:hover {
      color: var(--text);
      border-color: var(--accent);
      box-shadow: 0 0 18px var(--accent-glow);
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 10px 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      border-radius: 8px;
    }
    .tab-btn:hover {
      color: var(--text);
      background: rgba(255,255,255,.05);
    }
    .tab-btn.active {
      color: var(--accent);
      background: rgba(0,204,255,.1);
      box-shadow: inset 0 -2px 0 var(--accent);
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 16px 44px rgba(0,0,0,.16);
      backdrop-filter: blur(12px);
    }
    .section-title {
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 18px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 11px 20px;
      border-radius: 11px;
      border: none;
      font-family: 'Syne', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, transform .12s;
      white-space: nowrap;
    }
    .btn:hover:not(:disabled) { opacity: .85; transform: translateY(-1px); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary {
      background: var(--brand-gradient);
      color: #07080f;
      box-shadow: 0 4px 20px rgba(0,255,136,.16);
    }
    .btn-primary:hover:not(:disabled) {
      opacity: 1;
      box-shadow: 0 8px 30px rgba(0,255,136,.28);
    }
    .btn-secondary { background: rgba(255,255,255,.04); border: 1px solid var(--border); color: var(--text); }
    .btn-danger    { background: var(--red);   color: #fff; }
    .btn-sm { padding: 7px 13px; font-size: 0.8rem; }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 22px;
      font-size: 0.88rem;
      box-shadow: 0 12px 40px rgba(0,0,0,.6);
      transition: transform .3s cubic-bezier(.22,1,.36,1), opacity .3s;
      opacity: 0;
      z-index: 9000;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.success { border-color: var(--green); color: var(--green); }
    .toast.error   { border-color: var(--red);   color: var(--red);   }

    .invites-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
      gap: 14px;
    }
    .tab-content > .table-header { padding: 2px 2px 8px; }
    .tab-content > .table-header .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: .82rem;
      letter-spacing: .12em;
    }
    .tab-content > .table-header .section-title::before {
      content: '';
      width: 3px;
      height: 16px;
      border-radius: 3px;
      background: var(--brand-gradient);
    }
    .field { margin-bottom: 14px; }
    label {
      display: block;
      font-size: .75rem;
      color: var(--muted);
      margin-bottom: 6px;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    input:not([type="checkbox"]), select, textarea {
      width: 100%;
      padding: 12px 14px;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font: .88rem 'JetBrains Mono', monospace;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input:not([type="checkbox"]):focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    input[type="checkbox"] { width: auto; accent-color: var(--green); }
    select option { background: var(--surface); }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    .invite-card {
      min-width: 0;
      background: rgba(255,255,255,.03);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      transition: border-color .2s, transform .2s, box-shadow .2s;
    }
    .invite-card:hover {
      border-color: rgba(0,204,255,.35);
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(0,204,255,.08);
    }
    .invite-card .meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 4px;
      overflow-wrap: anywhere;
      line-height: 1.6;
    }
    .user-card .user-card-name {
      color: var(--text);
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .user-card .user-card-role {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 7px;
      margin-top: 6px;
      padding: 5px 9px;
      border: 1px solid rgba(0,204,255,.2);
      border-radius: 999px;
      background: rgba(0,204,255,.07);
      color: var(--accent);
      font-size: .68rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .user-card .user-card-role::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px rgba(0,255,136,.5);
    }
    .invite-card .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }
    .user-card .actions .btn {
      flex: 1 1 145px;
      justify-content: center;
      min-width: 0;
      white-space: normal;
      text-align: center;
      line-height: 1.35;
    }
    .user-card .btn-danger {
      background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.28);
      color: #ff8585;
    }
    .user-card .btn-danger:hover:not(:disabled) {
      background: rgba(239,68,68,.2);
      border-color: rgba(239,68,68,.5);
    }
    .tab-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .table-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,.04) 25%, rgba(0,204,255,.12) 50%, rgba(255,255,255,.04) 75%);
      background-size: 400% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
    }
    @keyframes shimmer { to { background-position: -400% 0; } }
    @media (max-width: 760px) {
      body { padding: 18px 14px 40px; }
      header { align-items: flex-start; flex-direction: column; }
      .user-info { width: 100%; }
      .tabs { overflow-x: auto; scrollbar-width: thin; }
    }
    @media (max-width: 480px) {
      body { padding: 16px 12px 32px; }
      header { padding: 14px; }
      header h1 { font-size: 1.65rem; }
      .section { padding: 18px; }
      .tab-btn { padding: 9px 13px; font-size: .8rem; }
      .user-badge { white-space: normal; }
      .user-info { gap: 8px; }
      .user-info > * { max-width: 100%; }
      .user-card .actions .btn { flex-basis: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
<div class="container">

  <header>
    <div>
      <h1 data-i18n="adminPanel">Admin Panel</h1>
      <span data-i18n="subtitle">User Management & Invites</span>
    </div>
    <div class="user-info">
      <div class="user-badge">
        <span id="username">Loading...</span>
        <span class="role" id="userRole">-</span>
      </div>
      <button id="langBtn" class="lang-selector">🌐 NL</button>
      <button id="backBtn" class="btn btn-secondary btn-sm" data-i18n="backBtn">← Dashboard</button>
      <button id="logoutBtn" class="logout-btn" data-i18n="logoutBtn">↪ Uitloggen</button>
    </div>
  </header>

  <div class="section">
    <div class="tabs">
      <button class="tab-btn active" data-tab="users" data-i18n="usersTab">Users</button>
      <button class="tab-btn" data-tab="invites" data-i18n="invitesTab">Invites</button>
      <button class="tab-btn" data-tab="api" data-i18n="apiTab">API Token</button>
    </div>

    <div id="usersTab" class="tab-content active">
      <div class="table-header">
        <p class="section-title" style="margin:0;" data-i18n="usersTitle">Users</p>
      </div>
      <div id="usersList" class="invites-grid">
        <div class="skeleton" style="height:60px;"></div>
      </div>
    </div>

    <div id="invitesTab" class="tab-content">
      <div class="table-header">
        <p class="section-title" style="margin:0;" data-i18n="invitesTitle">Invites</p>
        <button id="generateInviteBtn" class="btn btn-primary" data-i18n="newInvite">+ Nieuwe Invite</button>
      </div>
      <div id="invitesList" class="invites-grid">
        <div class="skeleton" style="height:60px;"></div>
      </div>
    </div>

    <div id="apiTab" class="tab-content">
      <div class="table-header">
        <p class="section-title" style="margin:0;" data-i18n="apiTitle">API Token</p>
        <button id="generateApiTokenBtn" class="btn btn-primary" data-i18n="newApiToken">+ Generate New Token</button>
      </div>
      <div id="apiTokenSection" style="display:none;">
        <div class="field">
          <label data-i18n="currentApiToken">Current API Token:</label>
          <input type="text" id="apiTokenDisplay" readonly style="font-family:monospace;">
        </div>
        <div style="margin-top:12px;">
          <button id="copyApiTokenBtn" class="btn btn-secondary btn-sm" data-i18n="copyToken">📋 Copy Token</button>
        </div>
      </div>
      <div id="noApiToken" style="color:var(--muted);padding:12px;font-size:.85rem;" data-i18n="noApiToken">
        No API token generated yet.
      </div>
    </div>
  </div>

</div>

<div id="toast" class="toast"></div>

<script>
  'use strict';

  // ── Translations ─────────────────────────────────────────────────────────
  const translations = {
    nl: {
      adminPanel: 'Admin Panel',
      subtitle: 'User Management & Invites',
      backBtn: '← Dashboard',
      logoutBtn: '↪ Uitloggen',
      usersTab: 'Users',
      invitesTab: 'Invites',
      apiTab: 'API Token',
      usersTitle: 'Users',
      invitesTitle: 'Invites',
      apiTitle: 'API Token',
      newInvite: '+ Nieuwe Invite',
      newApiToken: '+ Generate New Token',
      user: 'User',
      email: 'Email',
      role: 'Role',
      makeAdmin: '↑ Make Admin',
      makeUser: '↓ Make User',
      token: 'Token',
      status: 'Status',
      statusPending: 'Pending',
      statusUsed: 'Used',
      created: 'Aangemaakt',
      copyInvite: '📋 Kopieer',
      copyToken: '📋 Copy Token',
      currentApiToken: 'Current API Token:',
      inviteLink: 'Invite link gekopieerd!',
      inviteFailed: 'Invite genereren mislukt.',
      inviteNetworkError: 'Netwerkfout bij invite.',
      inviteSuccess: 'Invite link gekopieerd!',
      noUsers: 'Geen users gevonden.',
      noInvites: 'Geen actieve invites.',
      noApiToken: 'No API token generated yet.',
      apiTokenGenerated: 'API token generated!',
      apiTokenFailed: 'API token generation failed.',
      apiTokenCopied: 'API token copied!',
      roleChanged: 'User is nu',
      roleChangeFailed: 'Role wijzigen mislukt.',
      roleNetworkError: 'Netwerkfout bij role wijzigen.',
      grantApiAccess: '✓ Grant API Access',
      revokeApiAccess: '✗ Revoke API Access',
      apiAccessGranted: 'API access granted',
      apiAccessRevoked: 'API access revoked',
      apiAccessChangeFailed: 'API access change failed',
      apiAccessNetworkError: 'Network error on API access change',
      deleteInvite: '🗑️ Verwijder',
      confirmDeleteInvite: 'Weet je zeker dat je deze invite wilt verwijderen?',
      inviteDeleted: 'Invite verwijderd!',
      inviteDeleteFailed: 'Invite verwijderen mislukt.',
      inviteDeleteNetworkError: 'Netwerkfout bij invite verwijderen.',
      confirmLogout: 'Weet je zeker dat je wilt uitloggen?',
      logoutError: 'Fout bij uitloggen.',
      resetPassword: '🔒 Reset Wachtwoord',
      enterNewPassword: 'Voer nieuw wachtwoord in (minimaal 6 tekens):',
      passwordTooShort: 'Wachtwoord moet minimaal 6 tekens zijn.',
      passwordResetSuccess: 'Wachtwoord succesvol gereset!',
      passwordResetFailed: 'Wachtwoord reset mislukt.',
      passwordResetNetworkError: 'Netwerkfout bij wachtwoord reset.'
    },
    en: {
      adminPanel: 'Admin Panel',
      subtitle: 'User Management & Invites',
      backBtn: '← Dashboard',
      logoutBtn: '↪ Logout',
      usersTab: 'Users',
      invitesTab: 'Invites',
      apiTab: 'API Token',
      usersTitle: 'Users',
      invitesTitle: 'Invites',
      apiTitle: 'API Token',
      newInvite: '+ New Invite',
      newApiToken: '+ Generate New Token',
      user: 'User',
      email: 'Email',
      role: 'Role',
      makeAdmin: '↑ Make Admin',
      makeUser: '↓ Make User',
      token: 'Token',
      status: 'Status',
      statusPending: 'Pending',
      statusUsed: 'Used',
      created: 'Created',
      copyInvite: '📋 Copy',
      copyToken: '📋 Copy Token',
      currentApiToken: 'Current API Token:',
      inviteLink: 'Invite link copied!',
      inviteFailed: 'Invite generation failed.',
      inviteNetworkError: 'Network error on invite.',
      inviteSuccess: 'Invite link copied!',
      noUsers: 'No users found.',
      noInvites: 'No active invites.',
      noApiToken: 'No API token generated yet.',
      apiTokenGenerated: 'API token generated!',
      apiTokenFailed: 'API token generation failed.',
      apiTokenCopied: 'API token copied!',
      roleChanged: 'User is now',
      roleChangeFailed: 'Role change failed.',
      roleNetworkError: 'Network error on role change.',
      grantApiAccess: '✓ Grant API Access',
      revokeApiAccess: '✗ Revoke API Access',
      apiAccessGranted: 'API access granted',
      apiAccessRevoked: 'API access revoked',
      apiAccessChangeFailed: 'API access change failed',
      apiAccessNetworkError: 'Network error on API access change',
      deleteInvite: '🗑️ Delete',
      confirmDeleteInvite: 'Are you sure you want to delete this invite?',
      inviteDeleted: 'Invite deleted!',
      inviteDeleteFailed: 'Invite deletion failed.',
      inviteDeleteNetworkError: 'Network error on invite deletion.',
      confirmLogout: 'Are you sure you want to logout?',
      logoutError: 'Logout error.',
      resetPassword: '🔒 Reset Password',
      enterNewPassword: 'Enter new password (minimum 6 characters):',
      passwordTooShort: 'Password must be at least 6 characters.',
      passwordResetSuccess: 'Password reset successfully!',
      passwordResetFailed: 'Password reset failed.',
      passwordResetNetworkError: 'Network error on password reset.'
    }
  };

  let currentLang = localStorage.getItem('lang') || 'nl';

  function setLanguage(lang) {
    currentLang = lang;
    localStorage.setItem('lang', lang);
    document.getElementById('langBtn').textContent = lang === 'nl' ? '🌐 NL' : '🌐 EN';

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (translations[lang][key]) {
        el.textContent = translations[lang][key];
      }
    });

    // Re-render dynamic content
    loadUsers();
    loadInvites();
  }

  function t(key) {
    return translations[currentLang][key] || key;
  }

  function showToast(msg, type = 'success') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className   = `toast ${type} show`;
    setTimeout(() => { el.className = 'toast'; }, 3000);
  }

  document.getElementById('backBtn').addEventListener('click', () => {
    window.location.href = '/dashboard';
  });

  document.getElementById('logoutBtn').addEventListener('click', logout);
  document.getElementById('langBtn').addEventListener('click', () => {
    setLanguage(currentLang === 'nl' ? 'en' : 'nl');
  });

  async function logout() {
    if (!confirm(t('confirmLogout'))) return;
    try {
      const res = await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' });
      if (res.ok) {
        window.location.href = '/login';
      }
    } catch (err) {
      alert(t('logoutError'));
    }
  }

  async function loadUserInfo() {
    try {
      const res = await fetch('/api/user', { credentials: 'same-origin' });
      const data = await res.json();
      console.log('User info response:', data);

      if (data.authenticated) {
        const usernameEl = document.getElementById('username');
        const userRoleEl = document.getElementById('userRole');

        if (usernameEl) usernameEl.textContent = data.user;
        if (userRoleEl) userRoleEl.textContent = data.role;
      }
    } catch (err) {
      console.error('Failed to load user info:', err);
    }
  }

  document.getElementById('generateInviteBtn').addEventListener('click', generateInvite);
  document.getElementById('generateApiTokenBtn').addEventListener('click', generateApiToken);
  document.getElementById('copyApiTokenBtn').addEventListener('click', copyApiToken);

  async function generateInvite() {
    try {
      const res = await fetch('/api/invites', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' }
      });
      const data = await res.json();
      
      if (data.success) {
        navigator.clipboard.writeText(data.inviteUrl);
        showToast(`Invite link gekopieerd!\n${data.inviteUrl}`, 'success');
        loadInvites();
      } else {
        showToast('Invite genereren mislukt.', 'error');
      }
    } catch (err) {
      showToast('Netwerkfout bij invite.', 'error');
    }
  }

  async function loadInvites() {
    const container = document.getElementById('invitesList');

    try {
      const res = await fetch('/api/invites', { credentials: 'same-origin' });
      const invites = await res.json();

      container.innerHTML = '';

      if (!invites.length) {
        const msg = document.createElement('p');
        msg.style.cssText = 'color:var(--muted);padding:12px;font-size:.85rem;';
        msg.textContent = t('noInvites');
        container.appendChild(msg);
        return;
      }

      invites.forEach(invite => {
        const card = document.createElement('div');
        card.className = 'invite-card';

        const token = document.createElement('div');
        token.className = 'meta';
        token.textContent = `${t('token')}: ${invite.invite_token}`;

        const status = document.createElement('div');
        status.className = 'meta';
        const isPending = invite.username.startsWith('pending');
        status.innerHTML = `${t('status')}: <span style="color:${isPending ? 'var(--accent)' : 'var(--green)'};font-weight:600;">${isPending ? t('statusPending') : t('statusUsed')}</span>`;

        const date = document.createElement('div');
        date.className = 'meta';
        const locale = currentLang === 'nl' ? 'nl-NL' : 'en-US';
        date.textContent = `${t('created')}: ${new Date(invite.created_at).toLocaleString(locale)}`;

        const actions = document.createElement('div');
        actions.className = 'actions';

        const copyBtn = document.createElement('button');
        copyBtn.className = 'btn btn-secondary btn-sm';
        copyBtn.textContent = t('copyInvite');
        copyBtn.onclick = () => {
          const url = `${window.location.origin}/register?token=${invite.invite_token}`;
          navigator.clipboard.writeText(url);
          showToast(t('inviteLink'), 'success');
        };

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'btn btn-danger btn-sm';
        deleteBtn.textContent = t('deleteInvite');
        deleteBtn.onclick = async () => {
          if (!confirm(t('confirmDeleteInvite'))) return;

          try {
            const res = await fetch(`/api/invites/${invite.invite_token}`, {
              method: 'DELETE',
              credentials: 'same-origin'
            });
            const data = await res.json();

            if (data.success) {
              showToast(t('inviteDeleted'), 'success');
              loadInvites();
            } else {
              showToast(t('inviteDeleteFailed'), 'error');
            }
          } catch (err) {
            showToast(t('inviteDeleteNetworkError'), 'error');
          }
        };

        // Only show delete button for pending invites
        if (isPending) {
          actions.appendChild(deleteBtn);
        }

        actions.appendChild(copyBtn);
        card.append(token, status, date, actions);
        container.appendChild(card);
      });
    } catch (err) {
      console.error('Invites laden mislukt:', err);
    }
  }

  async function loadUsers() {
    const container = document.getElementById('usersList');

    try {
      const res = await fetch('/api/users', { credentials: 'same-origin' });
      const users = await res.json();

      container.innerHTML = '';

      if (!users.length) {
        const msg = document.createElement('p');
        msg.style.cssText = 'color:var(--muted);padding:12px;font-size:.85rem;';
        msg.textContent = t('noUsers');
        container.appendChild(msg);
        return;
      }

      // Filter out pending users (invite tokens)
      const realUsers = users.filter(user => !user.username.startsWith('pending'));

      if (!realUsers.length) {
        const msg = document.createElement('p');
        msg.style.cssText = 'color:var(--muted);padding:12px;font-size:.85rem;';
        msg.textContent = t('noUsers');
        container.appendChild(msg);
        return;
      }

      realUsers.forEach(user => {
        const card = document.createElement('div');
        card.className = 'invite-card user-card';

        const username = document.createElement('div');
        username.className = 'meta user-card-name';
        username.textContent = user.username;

        const email = document.createElement('div');
        email.className = 'meta';
        email.textContent = `${t('email')}: ${user.email || '—'}`;

        const role = document.createElement('div');
        role.className = 'user-card-role';
        role.textContent = user.role;

        const actions = document.createElement('div');
        actions.className = 'actions';

        const toggleRoleBtn = document.createElement('button');
        toggleRoleBtn.className = 'btn btn-secondary btn-sm';
        toggleRoleBtn.textContent = user.role === 'admin' ? t('makeUser') : t('makeAdmin');
        toggleRoleBtn.onclick = () => toggleUserRole(user.username, user.role);

        const toggleApiAccessBtn = document.createElement('button');
        toggleApiAccessBtn.className = 'btn btn-secondary btn-sm';
        toggleApiAccessBtn.textContent = user.api_access ? t('revokeApiAccess') : t('grantApiAccess');
        toggleApiAccessBtn.onclick = () => toggleApiAccess(user.username, user.api_access);

        const resetPasswordBtn = document.createElement('button');
        resetPasswordBtn.className = 'btn btn-danger btn-sm';
        resetPasswordBtn.textContent = t('resetPassword');
        resetPasswordBtn.onclick = () => resetUserPassword(user.username);

        actions.appendChild(toggleRoleBtn);
        actions.appendChild(toggleApiAccessBtn);
        actions.appendChild(resetPasswordBtn);
        card.append(username, email, role, actions);
        container.appendChild(card);
      });
    } catch (err) {
      console.error('Users laden mislukt:', err);
    }
  }

  async function resetUserPassword(username) {
    const newPassword = prompt(t('enterNewPassword'));
    if (!newPassword || newPassword.length < 6) {
      showToast(t('passwordTooShort'), 'error');
      return;
    }

    try {
      const res = await fetch('/api/users/reset-password', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, newPassword })
      });
      const data = await res.json();

      if (data.success) {
        showToast(t('passwordResetSuccess'), 'success');
      } else {
        showToast(t('passwordResetFailed'), 'error');
      }
    } catch (err) {
      showToast(t('passwordResetNetworkError'), 'error');
    }
  }

  async function toggleUserRole(username, currentRole) {
    const newRole = currentRole === 'admin' ? 'user' : 'admin';
    try {
      const res = await fetch('/api/users/role', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, role: newRole })
      });
      const data = await res.json();

      if (data.success) {
        showToast(`${t('roleChanged')} "${username}" ${newRole}!`, 'success');
        loadUsers();
      } else {
        showToast(t('roleChangeFailed'), 'error');
      }
    } catch (err) {
      showToast(t('roleNetworkError'), 'error');
    }
  }

  async function toggleApiAccess(username, currentAccess) {
    const newAccess = !currentAccess;
    try {
      const res = await fetch('/api/users/api-access', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, api_access: newAccess })
      });
      const data = await res.json();

      if (data.success) {
        showToast(`${username} ${newAccess ? t('apiAccessGranted') : t('apiAccessRevoked')}!`, 'success');
        loadUsers();
      } else {
        showToast(t('apiAccessChangeFailed'), 'error');
      }
    } catch (err) {
      showToast(t('apiAccessNetworkError'), 'error');
    }
  }

  async function generateApiToken() {
    try {
      const res = await fetch('/api/api-token', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' }
      });
      const data = await res.json();

      if (data.success) {
        document.getElementById('apiTokenDisplay').value = data.api_token;
        document.getElementById('apiTokenSection').style.display = '';
        document.getElementById('noApiToken').style.display = 'none';
        showToast(t('apiTokenGenerated'), 'success');
      } else {
        showToast(t('apiTokenFailed'), 'error');
      }
    } catch (err) {
      showToast(t('apiTokenFailed'), 'error');
    }
  }

  async function copyApiToken() {
    const token = document.getElementById('apiTokenDisplay').value;
    if (token) {
      navigator.clipboard.writeText(token);
      showToast(t('apiTokenCopied'), 'success');
    }
  }

  async function loadApiToken() {
    try {
      const res = await fetch('/api/user', { credentials: 'same-origin' });
      const data = await res.json();

      if (data.authenticated && data.api_token) {
        document.getElementById('apiTokenDisplay').value = data.api_token;
        document.getElementById('apiTokenSection').style.display = '';
        document.getElementById('noApiToken').style.display = 'none';
      } else {
        document.getElementById('noApiToken').style.display = '';
        document.getElementById('apiTokenSection').style.display = 'none';
      }
    } catch (err) {
      console.error('Failed to load API token status:', err);
    }
  }

  // Tab switching
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.getAttribute('data-tab');

      // Update buttons
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      // Update content
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      document.getElementById(`${tab}Tab`).classList.add('active');
    });
  });

  document.addEventListener('DOMContentLoaded', () => {
    setLanguage(currentLang);
    loadUserInfo();
    loadUsers();
    loadInvites();
    loadApiToken();
  });
</script>
</body>
</html>
