<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracker Beheer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@600;800&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #07080f;
      --surface:  #0d0f1d;
      --border:   rgba(148,163,184,.12);
      --text:     #dde2ef;
      --muted:    #64748b;
      --accent:   #38bdf8;
      --green:    #22c55e;
      --red:      #ef4444;
      --radius:   18px;
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 20px 60px;
    }

    .container { max-width: 600px; margin: 0 auto; }

    header {
      display: flex;
      align-items: baseline;
      gap: 18px;
      margin-bottom: 30px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      background: linear-gradient(90deg, #00ff88, #00ccff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header span {
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: .05em;
    }

    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
    }
    .section-title {
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 18px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .field { margin-bottom: 14px; }
    label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; letter-spacing: .05em; text-transform: uppercase; }
    input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
      outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: var(--accent); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 11px 20px;
      border-radius: 11px;
      border: none;
      font-family: 'Syne', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, transform .12s;
      white-space: nowrap;
    }
    .btn:hover:not(:disabled) { opacity: .85; transform: translateY(-1px); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary   { background: var(--accent); color: #0b1219; }
    .btn-secondary { background: rgba(255,255,255,.08); color: var(--text); }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 22px;
      font-size: 0.88rem;
      box-shadow: 0 12px 40px rgba(0,0,0,.6);
      transition: transform .3s cubic-bezier(.22,1,.36,1), opacity .3s;
      opacity: 0;
      z-index: 9000;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.success { border-color: var(--green); color: var(--green); }
    .toast.error   { border-color: var(--red);   color: var(--red);   }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }
    .info-item {
      background: rgba(255,255,255,.04);
      padding: 14px;
      border-radius: 12px;
      font-size: 0.82rem;
    }
    .info-item strong {
      display: block;
      color: var(--accent);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
<div class="container">

  <header>
    <h1>Tracker Beheer</h1>
    <span>Management Link</span>
  </header>

  <div class="section">
    <p class="section-title">Tracker Info</p>
    <div class="info-grid">
      <div class="info-item">
        <strong>Naam</strong>
        <span id="trackerName">{{TRACKER_NAME}}</span>
      </div>
      <div class="info-item">
        <strong>ID</strong>
        <span id="trackerId">{{TRACKER_ID}}</span>
      </div>
    </div>
  </div>

  <div class="section">
    <p class="section-title">Instellingen</p>

    <div class="field">
      <label for="name">Naam</label>
      <input type="text" id="name" value="{{TRACKER_NAME}}">
    </div>

    <div class="field">
      <label for="destination">Doel-URL (https://)</label>
      <input type="text" id="destination" value="{{DESTINATION_URL}}">
    </div>

    <button class="btn btn-primary" id="saveBtn">
      💾 Opslaan
    </button>
  </div>

</div>

<div id="toast" class="toast"></div>

<script>
  'use strict';

  const managementKey = '{{MANAGEMENT_KEY}}';

  function showToast(msg, type = 'success') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className   = `toast ${type} show`;
    setTimeout(() => { el.className = 'toast'; }, 3000);
  }

  document.getElementById('saveBtn').addEventListener('click', async () => {
    const name = document.getElementById('name').value.trim();
    const destination = document.getElementById('destination').value.trim();

    if (!name || !destination) {
      showToast('Vul alle velden in.', 'error');
      return;
    }

    if (!destination.startsWith('https://')) {
      showToast('Doel-URL moet beginnen met https://', 'error');
      return;
    }

    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.textContent = 'Bezig…';

    try {
      const res = await fetch(`/api/manage/${managementKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, destination_url: destination })
      });

      const data = await res.json();

      if (!res.ok || !data.success) {
        showToast(data.error || 'Opslaan mislukt.', 'error');
        return;
      }

      showToast('Instellingen opgeslagen!', 'success');
      
      // Update UI
      document.getElementById('trackerName').textContent = data.tracker.name;
    } catch (err) {
      showToast('Netwerkfout bij opslaan.', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = '💾 Opslaan';
    }
  });
</script>
</body>
</html>
